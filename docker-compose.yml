version: '3.8'

services:
  postgis:
    image: postgis/postgis:16-3.4
    container_name: terraguard_postgis
    environment:
      POSTGRES_DB: terraguard_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD before starting the optional PostGIS service}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  pgdata:
